# Конфигурация для Pima Indians Diabetes Dataset
dataset:
  name: "Pima Indians Diabetes"
  source_type: "local"
  file_path: "./src/datasets/diabetes.csv"
  description: "768 пациентов, 8 признаков для предсказания наличия диабета"
  task_type: "classification"

  # Простая обработка для стандартного табличного датасета
  special_preprocessing:
    type: "diabetes"
    has_header: true
    column_names: null                # Есть заголовки в файле
    target_column: "Outcome"          # Целевая переменная
    target_mapping: null              # Целевая уже 0/1

preprocessing:
  test_size: 0.25
  random_state: 42
  scaling: true
  stratify: true

model:
  num_rules: 5          # Уменьшено для лучшей сходимости
  mf_class: "GBell"     # Изменено на GBell для лучшей работы
  optim: "OriginalPSO"
  optim_params:
    epoch: 20           # Уменьшено для ускорения
    pop_size: 30
    verbose: true
  reg_lambda: 0.1
  seed: 42

shap:
  gamma: 0.1            # Уменьшено для менее агрессивной регуляризации
  training_epochs: 25   # Увеличено для лучшего обучения
  batch_size: 32
  learning_rate: 0.005
  sample_size: 80
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001

visualization:
  figure_size: [20, 16]
  style: "seaborn-v0_8"
  save_plots: true
  plot_format: "png"
  dpi: 300
